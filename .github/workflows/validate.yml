name: PAW validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate repository structure and metadata
        run: python3 tools/validators/validate.py
      - name: Run comprehensive validation and regression checks
        run: python3 tools/validators/run_all.py
